<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow">
  <h1 class="text-3xl font-bold text-gray-900 mb-6">Lista Alumnos</h1>

  <form [formGroup]="formulario">
    <div class="mb-5">
      <label for="matricula" class="block mb-2 text-sm font-medium text-gray-900">Matricula</label>
      <input formControlName="matricula" type="text" id="matricula" name="matricula" placeholder="Matricula" 
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500
       focus:border-blue-500 block w-full p-2.5">
    </div>

    <div class="mb-5">
      <label for="nombre" class="block mb-2 text-sm font-medium text-gray-900">Nombre</label>
      <input formControlName="nombre" type="text" id="nombre" name="nombre" placeholder="Nombre" 
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500
       focus:border-blue-500 block w-full p-2.5">
    </div>

    <div class="mb-5">
      <label for="correo" class="block mb-2 text-sm font-medium text-gray-900">Correo</label>
      <input formControlName="correo" type="email" id="correo" name="correo" placeholder="Correo"
       class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500
        focus:border-blue-500 block w-full p-2.5">
    </div>

    <div class="mb-5">
      <label for="materia" class="block mb-2 text-sm font-medium text-gray-900">Materia</label>
      <input formControlName="materia"  type="text" id="materia" name="materia" placeholder="Materia" 
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500
       focus:border-blue-500 block w-full p-2.5">
    </div>

    <button (click)="muestraAlumnos()" type="submit" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5">Registrar</button>
  </form>

  <h2 class="text-2xl font-bold text-gray-900 mt-8 mb-4">Lista de alumnos</h2>
  <div>
    <h3>Matricula: {{alumno.matricula}}</h3>
    <h3>Nombre: {{alumno.nombre}}</h3>
    <h3>Correo: {{alumno.correo}}</h3>
    <h3>Materia: {{alumno.materia}}</h3>
  </div>
</div>
