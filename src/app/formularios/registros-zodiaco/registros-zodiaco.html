<div class="mt-8 p-6 bg-white border border-gray-200 rounded-lg shadow">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-xl font-bold text-gray-900">Registros del Zodiaco</h2>
    <button
      type="button"
      (click)="onVolver()"
      class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-xs px-3 py-1.5 text-center transition-colors"
    >
      Volver al formulario
    </button>
  </div>

  @if (registros.length > 0) {
    <div class="relative overflow-x-auto shadow-sm sm:rounded-lg border border-gray-200">
      <table class="w-full text-sm text-left text-gray-700">
        <thead class="text-xs text-gray-700 uppercase bg-gray-100">
          <tr>
            <th scope="col" class="px-6 py-3">Nombre</th>
            <th scope="col" class="px-6 py-3">Sexo</th>
            <th scope="col" class="px-6 py-3">Edad</th>
            <th scope="col" class="px-6 py-3">Signo</th>
            <th scope="col" class="px-6 py-3 text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (registro of registros; track $index) {
            <tr class="bg-white border-b border-gray-200 hover:bg-gray-50">
              <td class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap">
                {{ registro.nombre }}
              </td>
              <td class="px-6 py-4">
                {{ registro.sexo }}
              </td>
              <td class="px-6 py-4">
                {{ registro.edad }}
              </td>
              <td class="px-6 py-4 font-semibold text-blue-600">
                {{ registro.signo }}
              </td>
              <td class="px-6 py-4 text-center">
                <div class="flex justify-center gap-2">
                  <button
                    type="button"
                    (click)="onEditar($index)"
                    class="px-3 py-1.5 text-xs font-medium text-white bg-green-600 rounded-lg hover:bg-green-700 focus:ring-4 focus:outline-none focus:ring-green-300"
                  >
                    Editar
                  </button>
                  <button
                    type="button"
                    (click)="onEliminar($index)"
                    class="px-3 py-1.5 text-xs font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 focus:ring-4 focus:outline-none focus:ring-red-300"
                  >
                    Eliminar
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  } @else {
    <div class="p-4 text-sm text-gray-700 rounded-lg bg-gray-50 border border-gray-200 text-center" role="alert">
      No hay registros guardados.
    </div>
  }
</div>
